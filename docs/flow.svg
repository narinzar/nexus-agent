<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
  </defs>
  <text x="16" y="26" font-size="17" font-weight="700" fill="#888">How Nexus works</text>

  <!-- 1. start -->
  <text x="16" y="56" font-size="12" font-weight="700" fill="#4C78A8">1. START</text>
  <rect x="16" y="64" width="160" height="62" rx="8" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <text x="96" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#888">nexus new "idea"</text>
  <text x="96" y="104" text-anchor="middle" font-size="11" fill="#888">writes spec, backlog</text>
  <text x="96" y="118" text-anchor="middle" font-size="11" fill="#888">and a working skeleton</text>
  <text x="96" y="146" text-anchor="middle" font-size="12" fill="#888">or</text>
  <rect x="16" y="156" width="160" height="62" rx="8" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <text x="96" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#888">nexus init</text>
  <text x="96" y="196" text-anchor="middle" font-size="11" fill="#888">takes over your repo:</text>
  <text x="96" y="210" text-anchor="middle" font-size="11" fill="#888">one rulebook for any agent</text>

  <!-- 2. backlog -->
  <text x="212" y="56" font-size="12" font-weight="700" fill="#B279A2">2. TO-DO LIST</text>
  <rect x="212" y="100" width="130" height="80" rx="8" fill="none" stroke="#B279A2" stroke-width="2"/>
  <text x="277" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#888">BACKLOG.md</text>
  <text x="277" y="144" text-anchor="middle" font-size="11" fill="#888">small items,</text>
  <text x="277" y="158" text-anchor="middle" font-size="11" fill="#888">each with its test</text>
  <line x1="176" y1="95" x2="210" y2="125" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="176" y1="187" x2="210" y2="157" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3. lanes -->
  <text x="378" y="56" font-size="12" font-weight="700" fill="#F58518">3. BUILD IN PARALLEL LANES</text>
  <rect x="378" y="64" width="200" height="40" rx="8" fill="none" stroke="#F58518" stroke-width="2"/>
  <text x="478" y="89" text-anchor="middle" font-size="12" fill="#888">lane 1: own branch + agent</text>
  <rect x="378" y="114" width="200" height="40" rx="8" fill="none" stroke="#F58518" stroke-width="2"/>
  <text x="478" y="139" text-anchor="middle" font-size="12" fill="#888">lane 2: own branch + agent</text>
  <rect x="378" y="164" width="200" height="40" rx="8" fill="none" stroke="#F58518" stroke-width="2"/>
  <text x="478" y="189" text-anchor="middle" font-size="12" fill="#888">lane 3: own branch + agent</text>
  <text x="478" y="224" text-anchor="middle" font-size="11" fill="#888">each agent sends the AI only the code</text>
  <text x="478" y="238" text-anchor="middle" font-size="11" fill="#888">its task needs, then checks and reviews</text>
  <line x1="342" y1="140" x2="376" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4. gates -->
  <text x="612" y="56" font-size="12" font-weight="700" fill="#2E9E5B">4. GATES DECIDE</text>
  <rect x="612" y="64" width="152" height="140" rx="8" fill="none" stroke="#2E9E5B" stroke-width="2"/>
  <text x="688" y="88" text-anchor="middle" font-size="12" fill="#888">tests pass</text>
  <text x="688" y="108" text-anchor="middle" font-size="12" fill="#888">lint, types, build pass</text>
  <text x="688" y="128" text-anchor="middle" font-size="12" fill="#888">no risky files touched</text>
  <text x="688" y="148" text-anchor="middle" font-size="12" fill="#888">still ready to hand over</text>
  <text x="688" y="168" text-anchor="middle" font-size="12" fill="#888">merges cleanly</text>
  <text x="688" y="190" text-anchor="middle" font-size="11" font-style="italic" fill="#888">not the AI's own "done"</text>
  <line x1="578" y1="134" x2="610" y2="134" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- outcomes -->
  <rect x="612" y="222" width="152" height="26" rx="13" fill="#2E9E5B"/>
  <text x="688" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">merged</text>
  <rect x="612" y="254" width="152" height="26" rx="13" fill="#F58518"/>
  <text x="688" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">retried</text>
  <rect x="612" y="286" width="152" height="26" rx="13" fill="#7f7f7f"/>
  <text x="688" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">held for you</text>
  <line x1="688" y1="204" x2="688" y2="220" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- loop -->
  <path d="M612 267 H277 V182" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="287" text-anchor="middle" font-size="12" fill="#888">--until-done: repeat until the to-do list is finished</text>
</svg>
